<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Incoming call</title>
<style>
  :root {
    /* Relay's dark palette; the light one below follows the system (and Relay's theme setting). */
    --text: #e8eaee; --text-2: #a2a9b6; --ok: #22c55e; --no: #ef4444; --accent: #8578ff;
    --glass: rgba(21, 24, 29, 0.92); --line: rgba(255, 255, 255, 0.1); --ring-shadow: rgba(0, 0, 0, 0.7);
    --avatar-ring: rgba(255, 255, 255, 0.14); --glow: 0.55;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --text: #15171c; --text-2: #5a6170; --accent: #6c5ce7; --glass: rgba(255, 255, 255, 0.94); --line: rgba(20, 24, 50, 0.1);
      --ring-shadow: rgba(20, 20, 40, 0.35); --avatar-ring: rgba(20, 24, 50, 0.08); --glow: 0.35; color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font: 14px/1.35 -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; color: var(--text); padding: 8px; -webkit-font-smoothing: antialiased; }
  .card {
    position: relative; height: 100%; border-radius: 22px; overflow: hidden; -webkit-app-region: drag;
    background: var(--glass); border: 1px solid var(--line);
    box-shadow: 0 18px 50px -18px var(--ring-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    -webkit-backdrop-filter: blur(30px) saturate(170%); backdrop-filter: blur(30px) saturate(170%);
    display: flex; align-items: center; gap: 14px; padding: 0 16px;
    animation: in 0.38s cubic-bezier(.2, 1.2, .3, 1) both;
  }
  .card.out { animation: out 0.24s ease-in both; }
  @keyframes in { from { opacity: 0; transform: translateY(-14px) scale(0.96); } }
  @keyframes out { to { opacity: 0; transform: translateY(-10px) scale(0.97); } }
  /* soft WhatsApp-green and accent glow behind the content */
  .card::before {
    content: ''; position: absolute; inset: -40%; z-index: 0; pointer-events: none; opacity: var(--glow);
    background:
      radial-gradient(40% 50% at 15% 30%, rgba(37, 211, 102, 0.55), transparent 70%),
      radial-gradient(40% 50% at 85% 20%, color-mix(in srgb, var(--accent) 50%, transparent), transparent 70%);
    animation: drift 9s ease-in-out infinite alternate;
  }
  @keyframes drift { to { transform: translate(6%, 4%) rotate(8deg); } }
  .card > * { position: relative; z-index: 1; }

  .avatar { position: relative; width: 62px; height: 62px; flex-shrink: 0; }
  .avatar img, .avatar .initials {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: grid; place-items: center;
    background: linear-gradient(135deg, #25d366, #128c7e); color: #fff; font-weight: 800; font-size: 22px;
    box-shadow: 0 0 0 2px var(--avatar-ring);
  }
  .avatar::before, .avatar::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--ok); opacity: 0;
    animation: pulse 1.8s ease-out infinite;
  }
  .avatar::after { animation-delay: 0.9s; }
  @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(1.55); opacity: 0; } }
  .wa {
    position: absolute; right: -3px; bottom: -3px; width: 22px; height: 22px; border-radius: 50%;
    background: #25d366; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--glass);
  }

  .info { flex: 1; min-width: 0; }
  .kind { font-size: 12px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
  .kind i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  .name { font-size: 17px; font-weight: 750; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .hint { font-size: 11.5px; color: var(--text-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .actions { display: flex; gap: 10px; -webkit-app-region: no-drag; }
  button {
    width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer; color: #fff;
    display: grid; place-items: center; transition: transform 0.15s, filter 0.15s, box-shadow 0.2s;
  }
  button:hover { transform: translateY(-1px) scale(1.06); filter: brightness(1.1); }
  button:active { transform: scale(0.95); }
  .no { background: linear-gradient(135deg, #f87171, #dc2626); box-shadow: 0 8px 22px -8px #ef4444; }
  .no svg { transform: rotate(135deg); }
  .ok { background: linear-gradient(135deg, #4ade80, #16a34a); box-shadow: 0 8px 22px -8px #22c55e; animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(-14deg); } 82% { transform: rotate(12deg); } 89% { transform: rotate(-8deg); } }
  .ok:hover { animation: none; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="avatar" id="avatar">
      <div class="initials" id="initials">?</div>
      <span class="wa"><svg width="12" height="12" viewBox="0 0 24 24"><path fill="#fff" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg></span>
    </div>
    <div class="info">
      <div class="kind"><i></i><span id="kind">Voice call</span></div>
      <div class="name" id="name">WhatsApp</div>
      <div class="hint" id="hint">WhatsApp · Relay</div>
    </div>
    <div class="actions">
      <button class="no" id="no" title="Decline" aria-label="Decline">
        <svg width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg>
      </button>
      <button class="ok" id="ok" title="Answer" aria-label="Answer">
        <svg id="okIcon" width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg>
      </button>
    </div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  const PHONE = 'M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z';
  const CAMERA = 'M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4Z';

  function initials(name) {
    const parts = String(name).replace(/[^\p{L}\p{N}\s]/gu, '').trim().split(/\s+/).filter(Boolean);
    return parts.length ? (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase() : '?';
  }

  window.callToast.onData((d) => {
    if (!d) return;
    $('name').textContent = d.name || 'WhatsApp';
    $('kind').textContent = d.video ? 'WhatsApp video call' : 'WhatsApp voice call';
    $('hint').textContent = d.test ? 'Just a test call'
      : d.linked ? 'Answer on this computer' : 'Connect WhatsApp Web in Settings to answer here';
    $('okIcon').querySelector('path').setAttribute('d', d.video ? CAMERA : PHONE);
    const box = $('avatar');
    box.querySelector('img')?.remove();
    $('initials').textContent = initials(d.name || 'W');
    $('initials').style.display = '';
    if (d.avatar) {
      const img = new Image();
      img.onload = () => { $('initials').style.display = 'none'; box.prepend(img); };
      img.src = d.avatar;
    }
    ring.start();
  });
  window.callToast.onEnd(() => { ring.stop(); $('card').classList.add('out'); });
  $('ok').onclick = () => { ring.stop(); window.callToast.answer(); };
  $('no').onclick = () => { ring.stop(); window.callToast.decline(); };
  // No keyboard shortcuts: this window pops up while you may be typing elsewhere, and a stray
  // Enter/Esc must never answer or decline a call.

  // A soft two-note marimba ring, made with Web Audio (no files needed).
  const ring = (() => {
    let ctx = null, timer = null;
    function note(t, freq, len) {
      const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o2.type = 'sine';
      o.frequency.value = freq; o2.frequency.value = freq * 4.01;
      const g2 = ctx.createGain(); g2.gain.value = 0.12;
      o.connect(g); o2.connect(g2).connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.32, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.start(t); o2.start(t); o.stop(t + len + 0.05); o2.stop(t + len + 0.05);
    }
    function phrase() {
      const t = ctx.currentTime + 0.02;
      [[659.25, 0], [880, 0.16], [987.77, 0.32], [880, 0.62], [987.77, 0.78]].forEach(([f, d]) => note(t + d, f, 0.5));
    }
    return {
      start() { if (timer) return; ctx ||= new AudioContext(); ctx.resume(); phrase(); timer = setInterval(phrase, 2400); },
      stop() { clearInterval(timer); timer = null; ctx?.suspend(); },
    };
  })();

  window.callToast.ready();
</script>
</body>
</html>
